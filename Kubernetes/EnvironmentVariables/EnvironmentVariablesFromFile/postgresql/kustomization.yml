# Secret Generator from .env file
#  kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: postgresql-secret-generator
resources:
  - DeployFromEnv.yml
secretGenerator:
  - name: postgresql-secret
    envs:
      - secrets.env
configMapGenerator:
  - name: postgresql-config
    envs:
      - config.env
