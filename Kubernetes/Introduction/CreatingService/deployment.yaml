# kubectl apply -f SimplePodCreation.yml


apiVersion: apps/v1
kind: Deployment
metadata:
  name: creating-service
  labels:
    app: creating-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
