apiVersion: v1
kind: Service
metadata:
  name: node-port-service
spec:
  type: NodePort
  selector:
    app: nginx # Use the same template > metadata > labels > app value from the deployment.yaml file
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007 # Optional, if not specified, a random port will be assigned in the range of 30000-32767